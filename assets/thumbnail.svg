<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="book-publishing: 대화로 책을 정하면, AI 팀이 쓰고 검수해 Word로 냅니다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="docx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#6366f1" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" text-anchor="middle">
    <text x="600" y="122" font-size="52" font-weight="800" fill="url(#title)">&#128218; book-publishing</text>
    <text x="600" y="170" font-size="23" fill="#475569">대화로 책을 정하면, AI 팀이 쓰고 검수해 Word로 냅니다</text>
  </g>

  <!-- Pipeline -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" text-anchor="middle" font-size="22" font-weight="700">
    <rect x="230" y="224" width="150" height="64" rx="32" fill="#ffffff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
    <text x="305" y="264" fill="#2563eb">&#128269; 리서치</text>

    <path d="M386 256 h22" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M404 247 l15 9 -15 9 z" fill="#94a3b8"/>

    <rect x="426" y="224" width="130" height="64" rx="32" fill="#ffffff" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
    <text x="491" y="264" fill="#059669">&#9997;&#65039; 집필</text>

    <path d="M562 256 h22" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M580 247 l15 9 -15 9 z" fill="#94a3b8"/>

    <rect x="602" y="224" width="160" height="64" rx="32" fill="#ffffff" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
    <text x="682" y="264" fill="#b45309">&#128172; 리뷰 &#215;9</text>

    <path d="M768 256 h22" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M786 247 l15 9 -15 9 z" fill="#94a3b8"/>

    <rect x="808" y="224" width="192" height="64" rx="32" fill="url(#docx)" filter="url(#shadow)"/>
    <text x="904" y="264" fill="#ffffff">&#128214; final.docx</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="352" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="16" fill="#64748b">&#34;책 써줘&#34; 한마디로 시작, 사람은 세 번만 확인합니다</text>
</svg>
